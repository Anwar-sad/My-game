name: Build Android APK (with native quiz widget)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get source files
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project and preinstalled SDK
        shell: bash
        run: |
          set -e
          if [ ! -f android/app/build.gradle ]; then
            echo "::error::Android project is missing. Upload the android folder from the complete ZIP package."
            exit 1
          fi
          echo "Android SDK: $ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "::error::Android SDK Platform 35 was not found on the runner."
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "::error::Android Build Tools 35.0.0 were not found on the runner."
            exit 1
          fi
          echo "Android SDK Platform 35 and Build Tools 35.0.0 are ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorAlIlm-Android-Widget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
